name: ci-docs-stub

# Mirror ci.yml's required check names with passing stubs when a PR only
# changes docs/license files. Without this stub, the required-status-check
# rules on `main` block docs-only PRs because ci.yml is skipped (paths-ignore)
# and the required checks never report.
#
# Trigger is the inverse of ci.yml: this workflow fires when at least one
# changed path matches `**.md` or `LICENSE`. Mixed PRs (code + docs) cause
# both workflows to run; the stub passes harmlessly while the real ci.yml
# determines actual status. Pure-code PRs only trigger ci.yml.

on:
  pull_request:
    paths:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only PR; ci.yml skipped, stub passing for ${{ matrix.os }} node-${{ matrix.node }}"
