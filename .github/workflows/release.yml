name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify version matches tag
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run test:integration
      - run: npm run build
      - name: Install fixture deps for E2E
        shell: bash
        run: |
          for proj in vitest-pass vitest-fail-many vitest-compile-error; do
            (cd "tests/fixtures/projects/$proj" && npm install --no-save --silent)
          done
      - run: npm run test:e2e
      - name: Verify crux-mcp handshake
        shell: bash
        run: node .github/scripts/verify-mcp-handshake.mjs
