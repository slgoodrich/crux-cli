name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

# Betterleaks v1.x exits 1 for both "leaks found" and "tool error"
# (https://github.com/betterleaks/betterleaks README "Exit Codes").
# Until upstream splits these, a red check could mean either; treat
# every failure as actionable and inspect the log.

env:
  BETTERLEAKS_VERSION: 1.2.0

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install betterleaks
        run: |
          set -euo pipefail
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          asset="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o bl.tgz "${base}/${asset}"
          curl -fsSL -o checksums.txt "${base}/checksums.txt"
          grep " ${asset}\$" checksums.txt | sed "s| .*| bl.tgz|" | sha256sum -c -
          mkdir -p bl-extract
          tar -xzf bl.tgz -C bl-extract betterleaks
          sudo install -m 0755 bl-extract/betterleaks /usr/local/bin/betterleaks
          betterleaks version

      - name: Scan git history
        run: betterleaks git . -v
